description: >-
  Octagos Health publishes no API lifecycle surface. There is no versioning policy, no
  deprecation or sunset policy, no public status page, no SLA document and no changelog —
  which follows from there being no public API to version. Product news is published as
  Learning Center articles, but those are dated marketing posts, not a release log.
