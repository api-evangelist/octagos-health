note: >-
  No X-RateLimit-*, RateLimit-* or Retry-After header could be observed either: the only
  unauthenticated endpoint reachable on the application host is
  https://app.octagos.com/api/health, which returns HTTP 503 "Unhealthy" with no
  rate-limit headers. Volume is instead negotiated commercially — the "Billable
  Transmissions Plan" scales cost with monthly transmission count — but that is a billing
  meter, not a runtime throttle, and Octagos publishes no figure for it.
