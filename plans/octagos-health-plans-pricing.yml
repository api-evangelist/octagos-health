billing_note: >-
  Pricing is quote-only. Procurement is also available through the Microsoft Azure
  Marketplace listing (azuremarketplace.microsoft.com/en-us/marketplace/apps/octagoshealthinc1738102119486.octagos-offer-01,
  HTTP 200), and Octagos states Azure MACC spend can be applied — but no price is
  published there either.
