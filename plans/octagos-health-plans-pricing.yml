description: >-
  Octagos publishes a named tier structure but NO prices. Every tier and every billing
  model routes to a "Get Started" / "Book a Demo" sales conversation — there is no
  self-serve signup, no published rate card, no per-patient or per-transmission figure,
  and no CPT-code-derived fee schedule. The tiers below are recorded verbatim from the
  pricing page; the absence of a number is the finding, not an omission on our part.
tags:
- Healthcare
