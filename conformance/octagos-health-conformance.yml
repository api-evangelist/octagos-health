posture: >-
  Octagos is a CONSUMER of healthcare interoperability standards, not a publisher of
  them. It integrates into customer-owned EHRs (Epic, Oracle Health, athenahealth,
  NextGen, MEDENT) as a SMART on FHIR application and via HL7 v2 messaging. The FHIR
  server in every one of those integrations belongs to the EHR vendor or the health
  system, not to Octagos.
