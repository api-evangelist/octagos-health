aid: octagos-health
name: Octagos Health
description: Octagos Health is a Houston, Texas based digital health company providing an AI-assisted
  cardiac remote monitoring platform for cardiology practices, electrophysiology labs and health systems.
  Its Atlas AI engine triages implantable cardiac device transmissions to suppress non-actionable alerts,
  paired with IBHRE-certified human device-specialist review (the "Two-Brain Approach"). The platform
  is vendor-neutral across Medtronic, Boston Scientific, Abbott/St. Jude, Biotronik and ARCS devices,
  covers in-clinic interrogations, remote transmissions, loop recorders, CardioMEMS heart-failure hemodynamics
  and the S-Patch EXL ambulatory ECG patch, and adds patient engagement, billing/revenue analytics and
  bi-directional EHR integration. Integration with Epic, Oracle Health, athenahealth, NextGen and MEDENT
  is delivered through HL7 v2 messaging, SMART on FHIR and FHIR APIs as an implementation service; Octagos
  publishes no public developer portal, API reference or machine-readable API contract of its own.
